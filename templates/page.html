{% extends "base.html" %}

{% block subtitle %} · {{ page.title }}{% endblock %}

{% block content %}
<div class="list-header">
    <h2>{{ page.extra.heading }}</h2>
    {{<btn_download filename={page.extra.bib}/>}}
</div>
{% if page.slug == "papers" %}{{<list_articles/>}}
{%- elif page.slug == "talks" %}{{<list_presentations/>}}
{%- elif page.slug == "drafts" %}{{<list_drafts/>}}
{%- endif %}
{% endblock %}
