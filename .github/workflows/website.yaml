on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

name: render-website

jobs:
  render-and-deploy:
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: google-chrome
      ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
      ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
      ZOTERO_ARTICLE: ${{ secrets.ZOTERO_ARTICLE }}
      ZOTERO_MANUSCRIPT: ${{ secrets.ZOTERO_MANUSCRIPT }}
      ZOTERO_PRESENTATION: ${{ secrets.ZOTERO_PRESENTATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: install.packages(c("httr2", "jsonlite"))
        shell: Rscript {0}

      - name: Install just and Zola
        uses: taiki-e/install-action@v2
        with:
          tool: just, zola

      - name: Render
        run: just download build

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: true
          branch: gh-pages
          folder: public
